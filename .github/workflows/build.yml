name: build

on:
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/jozwiaczek/caddy-homelab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          pull: true
          tags: caddy-homelab:test
      - name: Smoke test
        run: |
          mods="$(docker run --rm caddy-homelab:test caddy list-modules)"
          for m in dns.providers.cloudflare http.handlers.rate_limit http.handlers.replace_response; do
            echo "$mods" | grep -q "$m" || { echo "missing $m"; exit 1; }
          done
      - name: Compute tags
        id: tags
        run: |
          full="$(docker run --rm caddy-homelab:test caddy version | awk '{print $1}' | sed 's/^v//')"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "minor=${full%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        run: |
          for t in "${{ steps.tags.outputs.full }}" "${{ steps.tags.outputs.minor }}"; do
            docker tag caddy-homelab:test "$IMAGE:$t"
            docker push "$IMAGE:$t"
          done
